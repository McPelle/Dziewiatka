<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4524"/>
      <stop offset="0.5" stop-color="#11672f"/>
      <stop offset="1" stop-color="#083a1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vin" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.45" stop-color="#f7cf4e"/>
      <stop offset="0.75" stop-color="#e0a21f"/>
      <stop offset="1" stop-color="#a9760c"/>
    </linearGradient>
    <filter id="cien" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tło murawa -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- pionowe pasy boiska -->
  <g fill="#ffffff" opacity="0.045">
    <rect x="96" y="0" width="104" height="1024"/>
    <rect x="304" y="0" width="104" height="1024"/>
    <rect x="512" y="0" width="104" height="1024"/>
    <rect x="720" y="0" width="104" height="1024"/>
    <rect x="928" y="0" width="104" height="1024"/>
  </g>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#vin)"/>

  <!-- złota ramka -->
  <rect x="150" y="150" width="724" height="724" rx="150" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.55"/>

  <!-- wielka 9 -->
  <text x="498" y="760" font-family="'DejaVu Sans','Arial',sans-serif" font-size="800" font-weight="900"
        text-anchor="middle" fill="url(#gold)" stroke="#5c3d04" stroke-width="7" filter="url(#cien)">9</text>

  <!-- mała piłka (lewy dół 9, akcent napastnika) -->
  <g transform="translate(360,712)" filter="url(#cien)">
    <circle r="78" fill="#ffffff" stroke="#15321d" stroke-width="5"/>
    <g fill="#15321d">
      <polygon points="0,-34 32,-10 20,28 -20,28 -32,-10"/>
      <polygon points="0,-78 22,-50 0,-34 -22,-50" opacity="0.9"/>
      <polygon points="56,-20 70,14 44,34 20,28 32,-10" opacity="0.9"/>
      <polygon points="-56,-20 -32,-10 -20,28 -44,34 -70,14" opacity="0.9"/>
    </g>
  </g>
</svg>
